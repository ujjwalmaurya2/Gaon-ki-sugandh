<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Seamless White Studio Background -->
  <rect width="600" height="600" fill="#FFFFFF"/>
  
  <defs>
    <radialGradient id="corianderShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#000000" stopOpacity="0.22"/>
      <stop offset="50%" stopColor="#000000" stopOpacity="0.08"/>
      <stop offset="100%" stopColor="#000000" stopOpacity="0"/>
    </radialGradient>

    <linearGradient id="corianderPouchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#558B2F"/>
      <stop offset="40%" stopColor="#689F38"/>
      <stop offset="80%" stopColor="#558B2F"/>
      <stop offset="100%" stopColor="#33691E"/>
    </linearGradient>

    <linearGradient id="corianderPowderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8D6E63"/>
      <stop offset="50%" stopColor="#6D4C41"/>
      <stop offset="100%" stopColor="#558B2F"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="530" rx="150" ry="22" fill="url(#corianderShadow)"/>

  <!-- Stand-up Pouch Body -->
  <path d="M210 140 L390 140 L410 490 C410 520, 190 520, 190 490 Z" fill="url(#corianderPouchGrad)" stroke="#33691E" stroke-width="2"/>

  <!-- Top Zipper seal line -->
  <rect x="200" y="150" width="200" height="12" fill="#33691E" rx="2"/>

  <!-- White Label Panel -->
  <rect x="220" y="190" width="160" height="150" rx="12" fill="#FFFFFF" stroke="#0C831F" stroke-width="1.5"/>

  <text x="300" y="218" text-anchor="middle" fill="#0C831F" font-family="Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="2">GAON KI SUGANDH</text>
  <text x="300" y="244" text-anchor="middle" fill="#558B2F" font-family="Arial, sans-serif" font-weight="900" font-size="16">STONE-POUNDED</text>
  <text x="300" y="268" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-weight="900" font-size="16">CORIANDER POWDER</text>
  <text x="300" y="286" text-anchor="middle" fill="#0C831F" font-family="Arial, sans-serif" font-weight="800" font-size="10">RETAINED VOLATILE OILS • DHANIYA</text>
  <text x="300" y="318" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-weight="700" font-size="11">Ramganj Mandi • Net Wt. 250 g</text>

  <!-- Green Veg Logo -->
  <rect x="350" y="200" width="14" height="14" stroke="#0C831F" stroke-width="1.5" fill="#FFFFFF"/>
  <circle cx="357" cy="207" r="3.5" fill="#0C831F"/>

  <!-- Transparent Product Window showing fresh green-brown dhaniya powder -->
  <ellipse cx="300" cy="410" rx="65" ry="45" fill="url(#corianderPowderGrad)" stroke="#FFFFFF" stroke-width="3"/>
  
  <text x="300" y="485" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="13" letter-spacing="1">100% ORGANIC & PURE</text>
</svg>
