<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Seamless White Studio Background -->
  <rect width="600" height="600" fill="#FFFFFF"/>
  
  <defs>
    <radialGradient id="chilliShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#000000" stopOpacity="0.22"/>
      <stop offset="50%" stopColor="#000000" stopOpacity="0.08"/>
      <stop offset="100%" stopColor="#000000" stopOpacity="0"/>
    </radialGradient>

    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#D32F2F"/>
      <stop offset="40%" stopColor="#F44336"/>
      <stop offset="80%" stopColor="#E53935"/>
      <stop offset="100%" stopColor="#B71C1C"/>
    </linearGradient>

    <linearGradient id="windowSpice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#D50000"/>
      <stop offset="100%" stopColor="#8A0000"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="530" rx="150" ry="22" fill="url(#chilliShadow)"/>

  <!-- Stand-up Pouch Body -->
  <path d="M210 140 L390 140 L410 490 C410 520, 190 520, 190 490 Z" fill="url(#pouchGrad)" stroke="#B71C1C" stroke-width="2"/>

  <!-- Top Zipper seal line -->
  <rect x="200" y="150" width="200" height="12" fill="#B71C1C" rx="2"/>
  <circle cx="290" cy="125" r="4" fill="#B71C1C"/>
  <path d="M285 120 C285 110, 315 110, 315 120" stroke="#B71C1C" stroke-width="2" fill="none"/>

  <!-- White Label Panel -->
  <rect x="220" y="190" width="160" height="150" rx="12" fill="#FFFFFF" stroke="#0C831F" stroke-width="1.5"/>

  <text x="300" y="218" text-anchor="middle" fill="#0C831F" font-family="Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="2">GAON KI SUGANDH</text>
  <text x="300" y="244" text-anchor="middle" fill="#D32F2F" font-family="Arial, sans-serif" font-weight="900" font-size="18">KASHMIRI</text>
  <text x="300" y="268" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-weight="900" font-size="16">LAL MIRCH POWDER</text>
  <text x="300" y="286" text-anchor="middle" fill="#0C831F" font-family="Arial, sans-serif" font-weight="800" font-size="10">STEMLESS • PURE NATURAL CRIMSON</text>
  <text x="300" y="318" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-weight="700" font-size="11">Net Wt. 250 g</text>

  <!-- Green Veg Logo -->
  <rect x="350" y="200" width="14" height="14" stroke="#0C831F" stroke-width="1.5" fill="#FFFFFF"/>
  <circle cx="357" cy="207" r="3.5" fill="#0C831F"/>

  <!-- Transparent Product Window showing vibrant crimson chili powder -->
  <ellipse cx="300" cy="410" rx="65" ry="45" fill="url(#windowSpice)" stroke="#FFFFFF" stroke-width="3"/>
  <ellipse cx="300" cy="410" rx="63" ry="43" fill="#D50000" opacity="0.3"/>
  
  <!-- Texture inside window -->
  <circle cx="280" cy="400" r="1.5" fill="#FF8A80"/>
  <circle cx="320" cy="420" r="2" fill="#FF8A80"/>
  <circle cx="305" cy="405" r="1.5" fill="#FF8A80"/>

  <text x="300" y="485" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="13" letter-spacing="1">100% ORGANIC & PURE</text>
</svg>
