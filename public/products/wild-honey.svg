<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Seamless White Studio Background -->
  <rect width="600" height="600" fill="#FFFFFF"/>
  
  <defs>
    <radialGradient id="honeyShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#000000" stopOpacity="0.25"/>
      <stop offset="50%" stopColor="#000000" stopOpacity="0.08"/>
      <stop offset="100%" stopColor="#000000" stopOpacity="0"/>
    </radialGradient>

    <linearGradient id="amberHoney" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FFB300"/>
      <stop offset="40%" stopColor="#FFA000"/>
      <stop offset="70%" stopColor="#FF8F00"/>
      <stop offset="100%" stopColor="#E65100"/>
    </linearGradient>

    <linearGradient id="glassGlare" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.8"/>
      <stop offset="30%" stopColor="#FFFFFF" stopOpacity="0.1"/>
      <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="530" rx="150" ry="22" fill="url(#honeyShadow)"/>

  <!-- Hexagonal Glass Jar Body -->
  <path d="M210 210 L390 210 L410 480 C410 510, 190 510, 190 480 Z" fill="url(#amberHoney)" stroke="#B26A00" stroke-width="2"/>
  <path d="M210 210 L390 210 L410 480 C410 510, 190 510, 190 480 Z" fill="url(#glassGlare)"/>

  <!-- Glass Highlight Line -->
  <path d="M225 230 L220 480" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- Label -->
  <rect x="220" y="270" width="160" height="150" rx="10" fill="#FFFFFF" stroke="#0C831F" stroke-width="2"/>

  <text x="300" y="298" text-anchor="middle" fill="#0C831F" font-family="Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="2">GAON KI SUGANDH</text>
  <text x="300" y="324" text-anchor="middle" fill="#D97706" font-family="Arial, sans-serif" font-weight="900" font-size="16">RAW UNPROCESSED</text>
  <text x="300" y="348" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-weight="900" font-size="18">WILD FOREST HONEY</text>
  <text x="300" y="368" text-anchor="middle" fill="#0C831F" font-family="Arial, sans-serif" font-weight="800" font-size="10">UNHEATED • RICH IN BEE POLLEN</text>

  <!-- Honeybee emblem on label -->
  <ellipse cx="300" cy="390" rx="8" ry="6" fill="#F8CB46" stroke="#000000" stroke-width="1"/>
  <ellipse cx="295" cy="383" rx="4" ry="5" fill="#E1F5FE" opacity="0.7"/>
  <ellipse cx="305" cy="383" rx="4" ry="5" fill="#E1F5FE" opacity="0.7"/>

  <!-- Green Veg Logo -->
  <rect x="350" y="280" width="14" height="14" stroke="#0C831F" stroke-width="1.5" fill="#FFFFFF"/>
  <circle cx="357" cy="287" r="3.5" fill="#0C831F"/>

  <!-- Golden Metal Lid with honeycomb design -->
  <rect x="220" y="170" width="160" height="32" rx="6" fill="#F8CB46" stroke="#D97706" stroke-width="2"/>
  <rect x="225" y="196" width="150" height="14" rx="2" fill="#E5A100"/>

  <!-- Wooden Dipper resting alongside jar -->
  <g transform="translate(385, 260) rotate(15)">
    <rect x="18" y="0" width="6" height="240" rx="3" fill="#8D6E63" stroke="#5D4037" stroke-width="1"/>
    <ellipse cx="21" cy="220" rx="14" ry="16" fill="#FFB300" stroke="#8D6E63" stroke-width="2"/>
    <line x1="7" y1="210" x2="35" y2="210" stroke="#5D4037" stroke-width="2"/>
    <line x1="7" y1="220" x2="35" y2="220" stroke="#5D4037" stroke-width="2"/>
    <line x1="7" y1="230" x2="35" y2="230" stroke="#5D4037" stroke-width="2"/>
  </g>
</svg>
