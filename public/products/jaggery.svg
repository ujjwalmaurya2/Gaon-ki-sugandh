<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Seamless White Studio Background -->
  <rect width="600" height="600" fill="#FFFFFF"/>
  
  <defs>
    <radialGradient id="jaggeryShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#000000" stopOpacity="0.22"/>
      <stop offset="50%" stopColor="#000000" stopOpacity="0.08"/>
      <stop offset="100%" stopColor="#000000" stopOpacity="0"/>
    </radialGradient>

    <linearGradient id="kraftGur" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#C8A273"/>
      <stop offset="40%" stopColor="#DFBF92"/>
      <stop offset="80%" stopColor="#C8A273"/>
      <stop offset="100%" stopColor="#A88151"/>
    </linearGradient>

    <linearGradient id="gurPowder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A0522D"/>
      <stop offset="50%" stopColor="#8B4513"/>
      <stop offset="100%" stopColor="#5D2E0C"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="530" rx="150" ry="22" fill="url(#jaggeryShadow)"/>

  <!-- Stand-up Pouch Body -->
  <path d="M210 140 L390 140 L410 490 C410 520, 190 520, 190 490 Z" fill="url(#kraftGur)" stroke="#8C6737" stroke-width="2"/>
  <rect x="200" y="150" width="200" height="12" fill="#8C6737" rx="2"/>

  <!-- White Label Panel -->
  <rect x="220" y="190" width="160" height="150" rx="12" fill="#FFFFFF" stroke="#0C831F" stroke-width="1.5"/>

  <text x="300" y="218" text-anchor="middle" fill="#0C831F" font-family="Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="2">GAON KI SUGANDH</text>
  <text x="300" y="244" text-anchor="middle" fill="#8C6737" font-family="Arial, sans-serif" font-weight="900" font-size="16">CHEMICAL-FREE DESI GUR</text>
  <text x="300" y="268" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-weight="900" font-size="18">JAGGERY POWDER</text>
  <text x="300" y="286" text-anchor="middle" fill="#0C831F" font-family="Arial, sans-serif" font-weight="800" font-size="10">NATURAL CLARIFICATION • ZERO CHEMICALS</text>
  <text x="300" y="318" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-weight="700" font-size="11">Muzaffarnagar, UP • Net Wt. 1 kg</text>

  <!-- Green Veg Logo -->
  <rect x="350" y="200" width="14" height="14" stroke="#0C831F" stroke-width="1.5" fill="#FFFFFF"/>
  <circle cx="357" cy="207" r="3.5" fill="#0C831F"/>

  <!-- Product Window showing golden brown jaggery granules -->
  <ellipse cx="300" cy="415" rx="68" ry="46" fill="url(#gurPowder)" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="280" cy="405" r="2" fill="#CD853F"/>
  <circle cx="320" cy="415" r="3" fill="#CD853F"/>
  <circle cx="300" cy="430" r="2.5" fill="#D2691E"/>

  <text x="300" y="490" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="1">100% UNREFINED SWEETENER</text>
</svg>
