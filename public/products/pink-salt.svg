<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Seamless White Studio Background -->
  <rect width="600" height="600" fill="#FFFFFF"/>
  
  <defs>
    <radialGradient id="saltShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#000000" stopOpacity="0.22"/>
      <stop offset="50%" stopColor="#000000" stopOpacity="0.08"/>
      <stop offset="100%" stopColor="#000000" stopOpacity="0"/>
    </radialGradient>

    <linearGradient id="saltPouch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#F8BBD0"/>
      <stop offset="30%" stopColor="#FCE4EC"/>
      <stop offset="70%" stopColor="#F8BBD0"/>
      <stop offset="100%" stopColor="#F48FB1"/>
    </linearGradient>

    <linearGradient id="pinkSaltCrystals" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF80AB"/>
      <stop offset="50%" stopColor="#EC407A"/>
      <stop offset="100%" stopColor="#C2185B"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="530" rx="150" ry="22" fill="url(#saltShadow)"/>

  <!-- Stand-up Pouch Body -->
  <path d="M210 140 L390 140 L410 490 C410 520, 190 520, 190 490 Z" fill="url(#saltPouch)" stroke="#EC407A" stroke-width="2"/>
  <rect x="200" y="150" width="200" height="12" fill="#EC407A" rx="2"/>

  <!-- White Label Panel -->
  <rect x="220" y="190" width="160" height="150" rx="12" fill="#FFFFFF" stroke="#0C831F" stroke-width="1.5"/>

  <text x="300" y="218" text-anchor="middle" fill="#0C831F" font-family="Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="2">GAON KI SUGANDH</text>
  <text x="300" y="244" text-anchor="middle" fill="#D81B60" font-family="Arial, sans-serif" font-weight="900" font-size="16">HIMALAYAN PINK</text>
  <text x="300" y="268" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-weight="900" font-size="17">ROCK SALT (SENDHA)</text>
  <text x="300" y="286" text-anchor="middle" fill="#0C831F" font-family="Arial, sans-serif" font-weight="800" font-size="10">84+ TRACE MINERALS • FASTING OK</text>
  <text x="300" y="318" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-weight="700" font-size="11">Himalayan Foothills • Net Wt. 1 kg</text>

  <!-- Green Veg Logo -->
  <rect x="350" y="200" width="14" height="14" stroke="#0C831F" stroke-width="1.5" fill="#FFFFFF"/>
  <circle cx="357" cy="207" r="3.5" fill="#0C831F"/>

  <!-- Product Window showing coarse pink crystal granules -->
  <ellipse cx="300" cy="415" rx="68" ry="46" fill="url(#pinkSaltCrystals)" stroke="#FFFFFF" stroke-width="3"/>
  
  <g fill="#FFFFFF" opacity="0.8">
    <rect x="270" y="400" width="6" height="6" transform="rotate(45 270 400)"/>
    <rect x="310" y="410" width="8" height="8" transform="rotate(25 310 410)"/>
    <rect x="290" y="430" width="7" height="7" transform="rotate(15 290 430)"/>
    <rect x="330" y="420" width="6" height="6" transform="rotate(60 330 420)"/>
  </g>

  <text x="300" y="490" text-anchor="middle" fill="#880E4F" font-family="Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="1">NATURALLY UNREFINED</text>
</svg>
