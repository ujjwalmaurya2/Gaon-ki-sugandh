<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Seamless White Studio Background -->
  <rect width="600" height="600" fill="#FFFFFF"/>
  
  <defs>
    <!-- Soft Contact Shadow -->
    <radialGradient id="gheeShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#000000" stopOpacity="0.25"/>
      <stop offset="50%" stopColor="#000000" stopOpacity="0.08"/>
      <stop offset="100%" stopColor="#000000" stopOpacity="0"/>
    </radialGradient>

    <!-- Golden Danedaar Ghee Gradient -->
    <linearGradient id="gheeFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FFE082"/>
      <stop offset="30%" stopColor="#FFD54F"/>
      <stop offset="70%" stopColor="#FFC107"/>
      <stop offset="100%" stopColor="#FFA000"/>
    </linearGradient>

    <!-- Glass Jar Gradient -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.8"/>
      <stop offset="20%" stopColor="#FFFFFF" stopOpacity="0.2"/>
      <stop offset="80%" stopColor="#FFFFFF" stopOpacity="0.1"/>
      <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="530" rx="160" ry="24" fill="url(#gheeShadow)"/>

  <!-- Glass Jar Body -->
  <rect x="200" y="210" width="200" height="290" rx="28" fill="url(#gheeFill)" stroke="#D4A017" stroke-width="2"/>

  <!-- Danedaar Ghee granular texture flecks -->
  <g fill="#FFE57F" opacity="0.6">
    <circle cx="230" cy="240" r="3"/>
    <circle cx="270" cy="260" r="2.5"/>
    <circle cx="340" cy="250" r="3.5"/>
    <circle cx="370" cy="275" r="2"/>
    <circle cx="240" cy="380" r="3"/>
    <circle cx="310" cy="420" r="4"/>
    <circle cx="360" cy="460" r="3"/>
    <circle cx="280" cy="470" r="2.5"/>
  </g>

  <!-- Glass Specular Highlight -->
  <rect x="200" y="210" width="200" height="290" rx="28" fill="url(#glassShine)"/>
  <path d="M220 230 L220 480" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Premium Label -->
  <rect x="215" y="270" width="170" height="175" rx="8" fill="#FFFFFF" stroke="#0C831F" stroke-width="2"/>
  
  <text x="300" y="300" text-anchor="middle" fill="#0C831F" font-family="Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="2">GAON KI SUGANDH</text>
  <text x="300" y="325" text-anchor="middle" fill="#D4A017" font-family="Arial, sans-serif" font-weight="900" font-size="16">A2 VEDIC GIR COW</text>
  <text x="300" y="348" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-weight="900" font-size="20">DESI GHEE</text>
  <text x="300" y="368" text-anchor="middle" fill="#0C831F" font-family="Arial, sans-serif" font-weight="800" font-size="11">BILONA CHURNED • 100% PURE</text>

  <!-- Gir Cow Silhouette Graphic -->
  <path d="M280 405 C275 395, 290 385, 300 385 C310 385, 325 395, 320 405 Z" fill="#D4A017"/>
  <circle cx="300" cy="395" r="6" fill="#F8CB46"/>

  <text x="300" y="425" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-weight="700" font-size="11">Gir Forest, Gujarat • 1 Litre</text>

  <!-- Green Veg Icon on Label -->
  <rect x="360" y="280" width="14" height="14" stroke="#0C831F" stroke-width="1.5" fill="#FFFFFF"/>
  <circle cx="367" cy="287" r="3.5" fill="#0C831F"/>

  <!-- Jar Neck & Traditional Cloth Cover (लाल/सुनहरी कपड़ा) -->
  <rect x="235" y="195" width="130" height="20" rx="4" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1.5"/>

  <!-- Red Cloth / Fabric Top with ruffled rim -->
  <path d="M210 170 Q300 145 390 170 C410 185, 410 205, 380 200 C360 215, 240 215, 220 200 C190 205, 190 185, 210 170 Z" fill="#C62828" stroke="#8E0000" stroke-width="2"/>
  
  <!-- Sacred Golden / Red Kalawa Thread tied around neck -->
  <ellipse cx="300" cy="195" rx="72" ry="8" fill="none" stroke="#F8CB46" stroke-width="4"/>
  <ellipse cx="300" cy="195" rx="72" ry="8" fill="none" stroke="#B71C1C" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Dangling thread knot -->
  <path d="M340 195 Q360 220 350 240" fill="none" stroke="#F8CB46" stroke-width="2.5"/>
  <path d="M344 195 Q355 220 358 245" fill="none" stroke="#B71C1C" stroke-width="2"/>
</svg>
