<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Seamless White Studio Background -->
  <rect width="600" height="600" fill="#FFFFFF"/>
  
  <defs>
    <radialGradient id="flaxShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#000000" stopOpacity="0.22"/>
      <stop offset="50%" stopColor="#000000" stopOpacity="0.08"/>
      <stop offset="100%" stopColor="#000000" stopOpacity="0"/>
    </radialGradient>

    <linearGradient id="flaxPouch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#D7CCC8"/>
      <stop offset="40%" stopColor="#EFEBE9"/>
      <stop offset="80%" stopColor="#D7CCC8"/>
      <stop offset="100%" stopColor="#BCAAA4"/>
    </linearGradient>

    <linearGradient id="flaxWindow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8D6E63"/>
      <stop offset="50%" stopColor="#6D4C41"/>
      <stop offset="100%" stopColor="#4E342E"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="530" rx="150" ry="22" fill="url(#flaxShadow)"/>

  <!-- Stand-up Pouch Body -->
  <path d="M210 140 L390 140 L410 490 C410 520, 190 520, 190 490 Z" fill="url(#flaxPouch)" stroke="#795548" stroke-width="2"/>
  <rect x="200" y="150" width="200" height="12" fill="#795548" rx="2"/>

  <!-- White Label Panel -->
  <rect x="220" y="190" width="160" height="150" rx="12" fill="#FFFFFF" stroke="#0C831F" stroke-width="1.5"/>

  <text x="300" y="218" text-anchor="middle" fill="#0C831F" font-family="Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="2">GAON KI SUGANDH</text>
  <text x="300" y="244" text-anchor="middle" fill="#795548" font-family="Arial, sans-serif" font-weight="900" font-size="16">ROASTED GOLDEN</text>
  <text x="300" y="268" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-weight="900" font-size="17">FLAX SEEDS (ALSI)</text>
  <text x="300" y="286" text-anchor="middle" fill="#0C831F" font-family="Arial, sans-serif" font-weight="800" font-size="10">OMEGA-3 RICH • CRISP ROASTED</text>
  <text x="300" y="318" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-weight="700" font-size="11">Malwa, MP • Net Wt. 250 g</text>

  <!-- Green Veg Logo -->
  <rect x="350" y="200" width="14" height="14" stroke="#0C831F" stroke-width="1.5" fill="#FFFFFF"/>
  <circle cx="357" cy="207" r="3.5" fill="#0C831F"/>

  <!-- Product Window showing glossy teardrop flax seeds -->
  <ellipse cx="300" cy="415" rx="68" ry="46" fill="url(#flaxWindow)" stroke="#FFFFFF" stroke-width="3"/>
  
  <g fill="#A1887F" stroke="#3E2723" stroke-width="0.8">
    <ellipse cx="265" cy="405" rx="6" ry="3.5" transform="rotate(25 265 405)"/>
    <ellipse cx="295" cy="400" rx="6.5" ry="3.5" transform="rotate(-15 295 400)"/>
    <ellipse cx="330" cy="410" rx="6" ry="3.2" transform="rotate(35 330 410)"/>
    <ellipse cx="280" cy="425" rx="6.2" ry="3.5" transform="rotate(-30 280 425)"/>
    <ellipse cx="315" cy="425" rx="6.5" ry="3.5" transform="rotate(10 315 425)"/>
  </g>

  <text x="300" y="490" text-anchor="middle" fill="#5D4037" font-family="Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="1">100% HEART HEALTHY</text>
</svg>
