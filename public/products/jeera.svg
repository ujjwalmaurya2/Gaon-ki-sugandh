<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Seamless White Studio Background -->
  <rect width="600" height="600" fill="#FFFFFF"/>
  
  <defs>
    <radialGradient id="jeeraShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#000000" stopOpacity="0.22"/>
      <stop offset="50%" stopColor="#000000" stopOpacity="0.08"/>
      <stop offset="100%" stopColor="#000000" stopOpacity="0"/>
    </radialGradient>

    <linearGradient id="kraftPouch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#D7CCC8"/>
      <stop offset="40%" stopColor="#EFEBE9"/>
      <stop offset="80%" stopColor="#D7CCC8"/>
      <stop offset="100%" stopColor="#BCAAA4"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="530" rx="150" ry="22" fill="url(#jeeraShadow)"/>

  <!-- Stand-up Pouch Body -->
  <path d="M210 140 L390 140 L410 490 C410 520, 190 520, 190 490 Z" fill="url(#kraftPouch)" stroke="#8D6E63" stroke-width="2"/>
  <rect x="200" y="150" width="200" height="12" fill="#8D6E63" rx="2"/>

  <!-- White Label Panel -->
  <rect x="220" y="190" width="160" height="150" rx="12" fill="#FFFFFF" stroke="#0C831F" stroke-width="1.5"/>

  <text x="300" y="218" text-anchor="middle" fill="#0C831F" font-family="Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="2">GAON KI SUGANDH</text>
  <text x="300" y="244" text-anchor="middle" fill="#5D4037" font-family="Arial, sans-serif" font-weight="900" font-size="16">WHOLE CUMIN SEEDS</text>
  <text x="300" y="268" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-weight="900" font-size="18">UNPOLISHED JEERA</text>
  <text x="300" y="286" text-anchor="middle" fill="#0C831F" font-family="Arial, sans-serif" font-weight="800" font-size="10">INTENSE AROMA & CRACKLE</text>
  <text x="300" y="318" text-anchor="middle" fill="#666666" font-family="Arial, sans-serif" font-weight="700" font-size="11">Unjha, Gujarat • Net Wt. 250 g</text>

  <!-- Green Veg Logo -->
  <rect x="350" y="200" width="14" height="14" stroke="#0C831F" stroke-width="1.5" fill="#FFFFFF"/>
  <circle cx="357" cy="207" r="3.5" fill="#0C831F"/>

  <!-- Transparent Product Window showing realistic whole cumin seeds -->
  <ellipse cx="300" cy="415" rx="70" ry="48" fill="#FFFBEA" stroke="#8D6E63" stroke-width="2"/>

  <!-- Seeds inside window -->
  <g fill="#5D4037" stroke="#3E2723" stroke-width="0.8">
    <ellipse cx="260" cy="400" rx="7" ry="2" transform="rotate(25 260 400)"/>
    <ellipse cx="290" cy="395" rx="7.5" ry="2.2" transform="rotate(-15 290 395)"/>
    <ellipse cx="330" cy="405" rx="6.8" ry="2.1" transform="rotate(35 330 405)"/>
    <ellipse cx="270" cy="425" rx="7.2" ry="2" transform="rotate(-30 270 425)"/>
    <ellipse cx="305" cy="420" rx="8" ry="2.3" transform="rotate(10 305 420)"/>
    <ellipse cx="340" cy="430" rx="7" ry="2" transform="rotate(-10 340 430)"/>
    <ellipse cx="285" cy="445" rx="7.5" ry="2.2" transform="rotate(40 285 445)"/>
    <ellipse cx="320" cy="442" rx="7" ry="2" transform="rotate(-25 320 442)"/>
  </g>

  <text x="300" y="490" text-anchor="middle" fill="#4E342E" font-family="Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="1">100% UNADULTERATED</text>
</svg>
